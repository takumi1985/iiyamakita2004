<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2004年卒 飯山北高校 同窓会 出欠状況確認</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 30px; }
        .info-section { background-color: #e8f4f8; padding: 15px; border-radius: 5px; margin-bottom: 30px; }
        .info-item { margin-bottom: 10px; font-size: 1.1em; }
        .info-label { font-weight: bold; color: #2980b9; display: inline-block; width: 80px; }
        
        /* アコーディオン（▽で開くやつ）のデザイン */
        details { margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; background-color: #fff; }
        summary { padding: 15px; font-size: 1.2em; font-weight: bold; background-color: #f8f9fa; cursor: pointer; list-style: none; position: relative; color: #34495e;}
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▽'; position: absolute; right: 15px; transition: transform 0.2s; color: #7f8c8d; }
        details[open] summary::after { transform: rotate(180deg); } /* 開いた時に△になる */
        details[open] summary { border-bottom: 1px solid #ddd; }
        
        .table-wrap { overflow-x: auto; padding: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f2f2f2; }
        
        /* 出欠の記号ごとの色分け */
        .status-attend { color: #27ae60; font-weight: bold; font-size: 1.1em; } /* ○は緑 */
        .status-absent { color: #c0392b; font-weight: bold; font-size: 1.1em; } /* ✕は赤 */
        .status-pending { color: #f39c12; font-weight: bold; font-size: 1.1em; } /* △はオレンジ */
    </style>
</head>
<body>

<div class="container">
    <h1>2004年卒 飯山北高校 同窓会<br>出欠状況確認</h1>

    <div class="info-section">
        <div class="info-item"><span class="info-label">開催日:</span> 2026年9月21日</div>
        <div class="info-item"><span class="info-label">場　所:</span> 未定</div>
    </div>

    <div id="attendance-container">
        <p style="text-align: center; color: #666;">データを読み込み中...</p>
    </div>
</div>

<script>
    // 設定済みのGASのURL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzj5oGeqAugMxOksian6vKSZnim7j-0udgI6iaKQ271yL9Azv-Y622J0ffzQg1aB78smw/exec';

    // ページ読み込み時にデータを取得する
    async function fetchAttendanceData() {
        const container = document.getElementById('attendance-container');
        try {
            const response = await fetch(GAS_URL);
            const data = await response.json();
            renderAccordion(data);
        } catch (error) {
            console.error('取得エラー:', error);
            container.innerHTML = '<p style="color:red; text-align:center;">データの読み込みに失敗しました。</p>';
        }
    }

    // 1〜4組のアコーディオンを作成する
    function renderAccordion(data) {
        const container = document.getElementById('attendance-container');
        container.innerHTML = ''; 

        const groups = ['1組', '2組', '3組', '4組'];
        
        groups.forEach(groupName => {
            // その組のデータだけを抽出
            const groupData = data.filter(item => String(item.group).includes(groupName.replace('組', '')));
            
            if (groupData.length === 0) return; // データがない組はスキップ

            // アコーディオン（details要素）を作成
            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = `${groupName} （${groupData.length}名）`;
            details.appendChild(summary);

            const tableWrap = document.createElement('div');
            tableWrap.className = 'table-wrap';
            
            // テーブルを作成（備考欄を追加しました）
            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th style="width: 20%;">氏名</th>
                        <th style="width: 25%;">LINE</th>
                        <th style="width: 15%;">出欠</th>
                        <th style="width: 40%;">備考</th>
                    </tr>
                </thead>
                <tbody></tbody>
            `;
            
            const tbody = table.querySelector('tbody');
            groupData.forEach(item => {
                const tr = document.createElement('tr');
                
                // 出欠の文字（○, △, ✕）によって色を変えるクラスを決定
                let statusClass = '';
                if (item.status === '○') statusClass = 'status-attend';
                else if (item.status === '✕') statusClass = 'status-absent';
                else if (item.status === '△') statusClass = 'status-pending';

                // L列（備考）のデータを受け取る（GAS側は、データ全体を取得した際、自動的に11番目の要素(row[11])以降も渡してくれています）
                // 前回のGASコードで取得範囲を自動拡張しているため、HTML側で item.message などとして呼び出せます。
                // もし表示されない場合は、GASでデータがどう格納されているか調整が必要ですが、通常は「row[11]」の位置になります。
                // 今回は前回のGASのオブジェクト構造に合わせつつ、備考（L列＝11番目）を読み込めるよう調整
                
                // ※重要：前回のGASコードの仕様により、L列は取得はされていますが名前をつけていなかったため、
                // 今回確実にL列を反映させるために、GASの変更なしで対応できるよう、
                // 念のためGASの修正もした方が確実ですが、まずはHTMLのこの記述で試してみます。
                
                tr.innerHTML = `
                    <td>${item.name}</td>
                    <td>${item.line}</td>
                    <td class="${statusClass}">${item.status || '-'}</td>
                    <td style="text-align: left;">${item.message || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
            
            tableWrap.appendChild(table);
            details.appendChild(tableWrap);
            container.appendChild(details);
        });
    }

    // 最初にデータを読み込む
    fetchAttendanceData();
</script>

</body>
</html>
